    // DESTINATION MAP

    // handles YouTube, Facebook, and Instagram downloads itself.
    // If you later get a dedicated TikTok tool link, swap it in below.

    var DESTINATIONS = {
      youtube:   "https://en1.savefrom.net/1-youtube-video-downloader-13sg/",
      facebook:  "https://en1.savefrom.net/1-youtube-video-downloader-13sg/",

    };

    var params = new URLSearchParams(window.location.search);
    var source = (params.get('to') || 'youtube').toLowerCase();
    var pastedUrl = params.get('url') || '';
    document.body.setAttribute('data-platform', DESTINATIONS[source] ? source : 'youtube');

    var target = DESTINATIONS[source] || DESTINATIONS.youtube;
    // If we captured the video URL the visitor pasted, forward it as a query param
    // (most destination tools accept ?url= — remove this if yours doesn't).
    var finalUrl = pastedUrl ? target + (target.indexOf('?') > -1 ? '&' : '?') + 'url=' + pastedUrl : target;

    var timeLeft = 5;
    var countdownEl = document.getElementById('countdown');
    var timer = setInterval(function () {
      timeLeft--;
      countdownEl.textContent = timeLeft > 0 ? "Redirecting in " + timeLeft + " seconds…" : "Redirecting…";
      if (timeLeft <= 0) {
        clearInterval(timer);
        goNow();
      }
    }, 1000);

    function goNow() {
      window.location.href = finalUrl;
    }
